name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -j FamilyLocationServer-windows.zip FamilyLocationServer.exe HOWTO.txt allow-firewall.ps1
          gh release create "$GITHUB_REF_NAME" \
            FamilyLocationServer.exe \
            FamilyLocationServer-windows.zip \
            --title "Family location server ${GITHUB_REF_NAME#v}" \
            --notes "Compiled Windows server. Each saved place has its own arrive and leave distance. History shows recent check-ins. File, Check-in database, lists the coordinates. Profile photos and battery percentage update from the phones."
