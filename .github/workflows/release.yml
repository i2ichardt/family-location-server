name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -j FamilyLocationServer-windows.zip FamilyLocationServer.exe HOWTO.txt allow-firewall.ps1
          gh release create "$GITHUB_REF_NAME" \
            FamilyLocationServer.exe \
            FamilyLocationServer-windows.zip \
            --title "Family location server ${GITHUB_REF_NAME#v}" \
            --notes "Family location server 1.9. Drops bad fixes, keeps the last 50 records per person, asks phones if they are alive, and minimizes to the system tray."
