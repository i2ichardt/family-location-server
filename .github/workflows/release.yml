name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -j FamilyLocationServer-windows.zip FamilyLocationServer.exe HOWTO.txt allow-firewall.ps1
          gh release create "$GITHUB_REF_NAME" \
            FamilyLocationServer.exe \
            FamilyLocationServer-windows.zip \
            --title "Family location server ${GITHUB_REF_NAME#v}" \
            --notes "Compiled Windows server. The zip includes the how-to and the firewall script. File, then Settings, holds the saved Tailscale address. Minimize keeps it on the taskbar. Closing the window stops the program."
